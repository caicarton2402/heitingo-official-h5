<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>无网社交</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: all 0.25s ease;
    }

    :root {
      --bg: #000000;
      --bg2: #111111;
      --bg3: #1C1C1E;
      --text: #FFFFFF;
      --text2: #8E8E93;
      --border: #2C2C2C;
      --grad1: #9D4EDD;
      --grad2: #C77DFF;
      --grad3: #E0AAFF;
      --red: #EF4444;
      --green: #34D399;
      --yellow: #FBBF24;
      --heart: #F472B6;
      --fire: #F97316;
    }

    body {
      background: var(--bg);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app-frame {
      width: 393px;
      height: 852px;
      background: var(--bg);
      border-radius: 50px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .screen {
      width: 100%;
      height: 100%;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      background: var(--bg);
    }

    .page {
      position: absolute;
      top: 0; left: 0;
      width: 100%; 
      height: 100%;
      background: var(--bg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      z-index: 0;
      overflow-y: auto;
      padding-bottom: 100px;
    }

    .page.active {
      opacity: 1;
      visibility: visible;
      z-index: 10;
    }

    .gradient {
      background: linear-gradient(90deg, var(--grad1), var(--grad2), var(--grad3));
    }

    .btn {
      height: 64px;
      border-radius: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      font-size: 18px;
      border: none;
      cursor: pointer;
      margin-top: 16px;
    }

    .btn.small {
      height: 40px;
      font-size: 14px;
      border-radius: 20px;
    }

    .btn.yellow {
      background: transparent;
      border: 1px solid var(--yellow);
      color: var(--yellow);
    }

    .btn:active { transform: scale(0.96); opacity: 0.9; }

    .tabbar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 80px;
      background: rgba(17,17,17,0.92);
      backdrop-filter: blur(20px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 20px;
      z-index: 999;
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text2);
      font-size: 11px;
      cursor: pointer;
    }

    .tab.active { color: white; }
    .tab ion-icon { font-size: 24px; }

    .card {
      background: var(--bg2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card.group-card {
      flex-direction: row;
      align-items: center;
    }

    .card.user-card {
      flex-direction: column;
      align-items: flex-start;
      width: calc(50% - 8px);
      margin-bottom: 16px;
      padding: 16px;
      min-height: 220px;
    }

    .avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
    }

    .avatar.sm { width: 44px; height: 44px; }
    .avatar.xs { width: 56px; height: 56px; }

    .input {
      background: var(--bg3);
      border-radius: 12px;
      padding: 16px 20px;
      color: white;
      border: none;
      margin: 12px 0;
      font-size: 17px;
      width: 100%;
    }

    .tag {
      background: var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      color: white;
      font-size: 12px;
      margin-right: 6px;
      display: inline-block;
    }

    .tag.active { background: linear-gradient(135deg, var(--grad1),var(--grad3)); }
    .tag.online { color: var(--green); background: transparent; }

    .overlay {
      position: absolute; top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,0.6); z-index:998;
      opacity:0; visibility:hidden;
    }
    .overlay.show { opacity:1; visibility:visible; }

    .modal {
      position: absolute;
      bottom: -100%; left:0; right:0;
      background: var(--bg2);
      border-radius: 28px 28px 0 0;
      padding: 32px; z-index:1000;
      max-height:70vh;
      overflow-y:auto;
    }
    .modal.show { bottom:0; }

    .toast {
      position: fixed; top: 120px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: white; padding: 10px 20px;
      border-radius: 12px; font-size:14px;
      opacity:0; z-index:9999;
    }
    .toast.show { opacity:1; }

    h1 { font-size: 40px; font-weight: 700; color: white; margin: 16px 0; }
    h2 { font-size: 32px; font-weight: 700; color: white; margin: 12px 0; }
    h3 { font-size: 24px; font-weight: 600; color: white; margin: 8px 0; }
    h4 { font-size: 18px; font-weight: 600; color: white; margin: 4px 0; }
    p { color: var(--text2); font-size: 15px; line-height: 1.4; }
    .caption { font-size: 12px; color: var(--text2); }
    .text-yellow { color: var(--yellow); }
    .text-heart { color: var(--heart); }
    .text-fire { color: var(--fire); }
    .text-green { color: var(--green); }

    .row { display:flex; align-items:center; gap:12px; margin:8px 0; }
    .row-between { display:flex; align-items:center; justify-content:space-between; width:100%; }
    .row-wrap { display:flex; flex-wrap:wrap; justify-content:space-between; width:100%; }
    .spacer { flex:1; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }

    ion-icon { font-size:22px; color:white; cursor:pointer; }
    ion-icon.yellow { color: var(--yellow); }
    ion-icon.green { color: var(--green); }

    .msg-left { background:var(--bg2); padding:14px 18px; border-radius:18px 18px 18px 4px; color:white; align-self:flex-start; max-width:75%; margin-bottom:10px; }
    .msg-right { background:linear-gradient(90deg,var(--grad1),var(--grad3)); padding:14px 18px; border-radius:18px 18px 4px 18px; color:white; align-self:flex-end; max-width:75%; margin-bottom:10px; }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .user-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      width: 100%;
      margin-top: 16px;
      margin-bottom: 20px;
    }

    .badge {
      background: var(--yellow);
      color: black;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge.fire {
      background: var(--fire);
      color: white;
    }
  </style>
</head>

<script>
// 核心修复：统一跳转函数，解决所有按钮点击失效
function goPage(id){
  document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
  if(document.querySelector(`.tabbar .tab[onclick="goPage('${id}')"]`)){
    document.querySelector(`.tabbar .tab[onclick="goPage('${id}')"]`).classList.add('active');
  }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showModal(id){
  document.getElementById('overlay').classList.add('show');
  document.getElementById(id).classList.add('show');
}

function closeModal(){
  document.getElementById('overlay').classList.remove('show');
  document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));
}

function msg(txt){
  const t=document.getElementById('toast');
  t.textContent=txt;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}
