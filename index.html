<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>无网社交 - UI 优化版</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ededed;
      --panel: #ffffff;
      --panel-2: #f7f7f7;
      --panel-3: #f2f2f2;
      --text: #111111;
      --muted: #7a7a7a;
      --soft: #4f5b5d;
      --line: rgba(0,0,0,.08);
      --green: #07c160;
      --green-2: #06ad56;
      --amber: #fa9d3b;
      --blue: #576b95;
      --violet: #8b6dff;
      --red: #fa5151;
      --shadow: 0 22px 70px rgba(0,0,0,.22);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: #dfe4e6;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .phone-shell {
      width: min(100%, 420px);
      height: min(880px, calc(100vh - 48px));
      min-height: 720px;
      background: #111111;
      border: 1px solid rgba(0,0,0,.14);
      border-radius: 34px;
      padding: 10px;
      box-shadow: var(--shadow);
    }

    .screen {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 26px;
      background: var(--bg);
      border: 1px solid rgba(0,0,0,.08);
    }

    .app-status {
      height: 38px;
      padding: 12px 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #111111;
      font-size: 12px;
      letter-spacing: 0;
    }

    .status-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mesh-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(7,193,96,.14);
    }

    main {
      height: calc(100% - 116px);
      overflow: auto;
      padding: 14px 18px 24px;
      scrollbar-width: none;
    }

    main::-webkit-scrollbar {
      display: none;
    }

    .page-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .title-block {
      min-width: 0;
    }

    .eyebrow {
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      margin: 0 0 6px;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      font-size: 29px;
      line-height: 1.12;
      letter-spacing: 0;
      font-weight: 850;
    }

    h2 {
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
      font-weight: 820;
    }

    h3 {
      font-size: 17px;
      line-height: 1.24;
      letter-spacing: 0;
      font-weight: 760;
    }

    p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .muted {
      color: var(--muted);
    }

    .soft {
      color: var(--soft);
    }

    .accent {
      color: var(--green);
    }

    .section-title {
      margin: 22px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      display: inline-grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-btn:active,
    .btn:active,
    .chip:active,
    .nav-item:active,
    .card:active {
      transform: translateY(1px);
    }

    .icon {
      font-size: 18px;
      line-height: 1;
    }

    .btn {
      min-height: 44px;
      border: 0;
      border-radius: var(--radius);
      padding: 0 16px;
      color: #ffffff;
      background: var(--green);
      font-weight: 750;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
    }

    .btn.secondary {
      color: var(--text);
      background: var(--panel-3);
      border: 1px solid var(--line);
    }

    .btn.warning {
      color: #ffffff;
      background: var(--green);
    }

    .btn.danger {
      color: #fff;
      background: var(--red);
    }

    .btn.ghost {
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
    }

    .btn.small {
      min-height: 36px;
      padding: 0 12px;
      font-size: 13px;
    }

    .btn.full {
      width: 100%;
    }

    .hero-panel {
      min-height: 176px;
      position: relative;
      isolation: isolate;
      border-radius: 12px;
      overflow: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(180deg, rgba(6,10,11,.08), rgba(6,10,11,.74)),
        linear-gradient(90deg, rgba(7,193,96,.24), rgba(87,107,149,.16)),
        var(--hero-image, none) center/cover;
      border: 0;
      box-shadow: 0 1px 0 rgba(0,0,0,.04);
    }

    .hero-panel.art-hero {
      background:
        linear-gradient(180deg, rgba(5,9,9,.08), rgba(5,9,9,.9)),
        linear-gradient(135deg, #0d2521 0%, #11191b 52%, #081210 100%);
      border-color: transparent;
      color: #ffffff;
    }

    .hero-panel.art-hero > :not(.hero-visual) {
      position: relative;
      z-index: 2;
    }

    .hero-panel.art-hero h2 {
      color: #ffffff;
      text-shadow: 0 1px 10px rgba(0,0,0,.34);
    }

    .hero-panel.art-hero p {
      color: rgba(255,255,255,.76);
    }

    .hero-visual {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .hero-visual svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hero-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
    }

    .signal-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      padding: 7px 10px;
      border-radius: var(--radius);
      background: rgba(5,9,9,.72);
      border: 1px solid rgba(255,255,255,.1);
      font-size: 12px;
      color: #ffffff;
      backdrop-filter: blur(16px);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      min-height: 70px;
      padding: 12px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }

    .stat strong {
      display: block;
      font-size: 20px;
      line-height: 1;
      color: var(--text);
      margin-bottom: 7px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 2px 0 4px;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      min-height: 34px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      color: #424242;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 13px;
    }

    .chip.active {
      background: rgba(7,193,96,.1);
      border-color: rgba(7,193,96,.5);
      color: var(--green);
      font-weight: 760;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--line);
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }

    .person-card {
      min-height: 214px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .avatar {
      position: relative;
      display: inline-grid;
      place-items: center;
      overflow: hidden;
      flex: 0 0 auto;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      color: #fff;
      font-weight: 800;
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,0)),
        var(--avatar-color, #256b57);
      isolation: isolate;
    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--avatar-image, none) center/cover;
      z-index: -1;
    }

    .avatar.sm {
      width: 44px;
      height: 44px;
      font-size: 14px;
    }

    .avatar.lg {
      width: 86px;
      height: 86px;
      font-size: 24px;
    }

    .avatar.square {
      border-radius: var(--radius);
    }

    .person-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .person-name {
      margin-top: 2px;
      min-width: 0;
    }

    .person-name h3 {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .distance {
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .match-ring {
      position: relative;
      isolation: isolate;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--green) calc(var(--match) * 1%), rgba(0,0,0,.08) 0);
      color: var(--text);
      font-size: 11px;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .match-ring::before {
      content: "";
      width: 28px;
      height: 28px;
      position: absolute;
      border-radius: 50%;
      background: var(--panel);
      z-index: -1;
    }

    .tag-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      min-height: 26px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 6px;
      background: #f2f2f2;
      color: var(--soft);
      font-size: 12px;
    }

    .card-actions {
      margin-top: auto;
      display: grid;
      grid-template-columns: 1fr 42px;
      gap: 8px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-card {
      min-height: 74px;
      padding: 13px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .list-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .list-copy {
      min-width: 0;
    }

    .list-copy h3,
    .list-copy p {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meta {
      text-align: right;
      flex: 0 0 auto;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 25px;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(25,195,125,.14);
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .badge.amber {
      background: rgba(255,176,32,.16);
      color: var(--amber);
    }

    .badge.red {
      background: rgba(255,90,103,.16);
      color: var(--red);
    }

    .chat-log {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 4px;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 14px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.44;
    }

    .bubble.left {
      align-self: flex-start;
      background: #ffffff;
      border-bottom-left-radius: 5px;
      border: 1px solid var(--line);
    }

    .bubble.right {
      align-self: flex-end;
      background: #95ec69;
      color: #111111;
      border-bottom-right-radius: 5px;
      font-weight: 650;
    }

    .composer {
      position: sticky;
      bottom: 0;
      margin: 20px -2px 0;
      height: 56px;
      border-radius: 12px;
      background: rgba(247,247,247,.94);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      backdrop-filter: blur(18px);
    }

    .composer input {
      min-width: 0;
      flex: 1;
      height: 40px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      padding: 0 8px;
    }

    .split-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .profile-hero {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid var(--line);
    }

    .map-panel {
      min-height: 260px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #dfeee6;
      border: 1px solid var(--line);
      box-shadow: 0 1px 0 rgba(0,0,0,.03);
    }

    .map-canvas {
      position: absolute;
      inset: 0;
    }

    .map-canvas svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-label {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border-radius: var(--radius);
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.07);
      padding: 12px;
      backdrop-filter: blur(16px);
    }

    .sos-panel {
      border-color: rgba(250,81,81,.22);
      background: #fff5f5;
    }

    .talk-button {
      width: 188px;
      height: 188px;
      border: 0;
      border-radius: 50%;
      margin: 28px auto;
      display: grid;
      place-items: center;
      color: #ffffff;
      background: var(--green);
      box-shadow: 0 16px 46px rgba(7,193,96,.25);
      cursor: pointer;
    }

    .talk-button strong {
      display: block;
      font-size: 18px;
      margin-top: 6px;
    }

    .splash {
      position: absolute;
      inset: 0;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 34px;
      background: #ffffff;
      color: #006eb6;
      cursor: pointer;
      transition: opacity .48s ease, visibility .48s ease;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-logo {
      width: min(96%, 350px);
      max-height: 132px;
      object-fit: contain;
      margin-bottom: 34px;
    }

    .splash-title {
      color: #0878c8;
      font-size: 25px;
      line-height: 1.2;
      font-weight: 850;
      letter-spacing: 0;
      text-align: center;
    }

    .splash-subtitle {
      margin-top: 9px;
      color: #4b6572;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 700;
      text-align: center;
    }

    .splash-enter {
      position: absolute;
      bottom: 42px;
      min-width: 112px;
      min-height: 42px;
      border: 0;
      border-radius: var(--radius);
      background: #0878c8;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(0,110,182,.2);
    }

    .nav {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 78px;
      padding: 8px 10px 14px;
      background: rgba(247,247,247,.94);
      border-top: 1px solid rgba(0,0,0,.08);
      backdrop-filter: blur(22px);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      z-index: 20;
    }

    .nav-item {
      min-width: 0;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 11px;
    }

    .nav-item.active {
      color: var(--green);
      background: transparent;
      font-weight: 700;
    }

    .nav-item.active .icon {
      color: var(--green);
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 30;
      background: rgba(0,0,0,.36);
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 40;
      max-height: 78%;
      overflow: auto;
      border-radius: 20px 20px 0 0;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding: 18px;
      transform: translateY(105%);
      transition: transform .22s ease;
      box-shadow: 0 -24px 60px rgba(0,0,0,.18);
    }

    .sheet.show {
      transform: translateY(0);
    }

    .sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .field {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      background: #f7f7f7;
      color: var(--text);
      outline: 0;
      border-radius: var(--radius);
      padding: 0 12px;
      margin: 8px 0;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 64px;
      z-index: 60;
      transform: translate(-50%, -10px);
      opacity: 0;
      pointer-events: none;
      min-height: 38px;
      max-width: calc(100% - 44px);
      display: flex;
      align-items: center;
      padding: 0 14px;
      border-radius: var(--radius);
      background: rgba(17,17,17,.9);
      color: #ffffff;
      box-shadow: 0 16px 40px rgba(0,0,0,.18);
      font-size: 13px;
      font-weight: 760;
      transition: opacity .18s ease, transform .18s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 520px) {
      body {
        padding: 0;
        background: var(--bg);
      }

      .phone-shell {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border: 0;
        border-radius: 0;
        padding: 0;
      }

      .screen {
        border-radius: 0;
        border: 0;
      }

      main {
        padding-inline: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="screen">
      <section class="splash" id="splash" aria-label="启动界面" onclick="enterApp()">
        <img class="splash-logo" src="outernet-logo-splash-white.png" alt="Outernet 无网通信 Logo" />
        <div class="splash-title">离线，不失联</div>
        <div class="splash-subtitle">Offline, not out of touch</div>
        <button class="splash-enter" type="button" onclick="event.stopPropagation();enterApp()">进入</button>
      </section>

      <div class="app-status">
        <span>09:41</span>
        <div class="status-dots">
          <span class="mesh-dot"></span>
          <span>Mesh 在线</span>
        </div>
      </div>

      <main id="app"></main>

      <nav class="nav" aria-label="主导航">
        <button class="nav-item" data-tab="discover" onclick="setTab('discover')"><span class="icon">⌕</span><span>发现</span></button>
        <button class="nav-item" data-tab="messages" onclick="setTab('messages')"><span class="icon">◐</span><span>消息</span></button>
        <button class="nav-item" data-tab="groups" onclick="setTab('groups')"><span class="icon">◎</span><span>群组</span></button>
        <button class="nav-item" data-tab="outdoor" onclick="setTab('outdoor')"><span class="icon">⌁</span><span>户外</span></button>
        <button class="nav-item" data-tab="profile" onclick="setTab('profile')"><span class="icon">●</span><span>我的</span></button>
      </nav>

      <div class="overlay" id="overlay" onclick="closeSheet()"></div>
      <section class="sheet" id="sheet" aria-live="polite"></section>
      <div class="toast" id="toast"></div>
    </div>
  </div>

  <script>
    const people = [
      {
        id: "liu",
        name: "刘雨",
        initial: "雨",
        distance: "320m",
        match: 92,
        status: "在线",
        tags: ["徒步", "摄影", "登山"],
        bio: "周末常走城郊山线，喜欢轻装徒步和记录路线。",
        color: "#2e7d68",

          <section class="list">
            <article class="card list-card" onclick="setView('device')">
              <div class="list-main"><span class="icon">▣</span><div class="list-copy"><h3>设备绑定</h3><p>手表、对讲模块、应急信标</p></div></div>
              <span class="badge">3 台</span>
            </article>
            <article class="card list-card" onclick="setView('member')">
              <div class="list-main"><span class="icon">◇</span><div class="list-copy"><h3>会员中心</h3><p>高级中继、路线备份、群组容量</p></div></div>
              <span class="badge amber">Pro</span>
            </article>
            <article class="card list-card" onclick="setView('privacy')">
              <div class="list-main"><span class="icon">◌</span><div class="list-copy"><h3>隐私设置</h3><p>可见距离、位置共享、阅后即焚</p></div></div>
              <span class="badge">已开启</span>
            </article>
          </section>`;
      },

      person() {
        const person = state.person;
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('discover')")}
            <div class="top-actions">
              ${iconButton("更多", "⋯", "openSheet('personMore')")}
            </div>
          </header>

          <section class="profile-hero">
            ${avatar(person, "lg")}
            <div>
              <h2>${person.name}</h2>
              <p>${person.distance} · ${person.status} · 匹配度 ${person.match}</p>
              <div class="tag-list" style="margin-top:10px">
                ${person.tags.map(tag => `<span class="tag">${tag}</span>`).join("")}
              </div>
            </div>
          </section>

          <div class="section-title">
            <h3>简介</h3>
          </div>
          <article class="card list-card" style="align-items:flex-start">
            <div>
              <h3>共同兴趣：${person.tags.slice(0, 2).join("、")}</h3>
              <p style="margin-top:6px;white-space:normal">${person.bio} 最近一次连接来自附近公共节点，可信距离 ${person.distance}。</p>
            </div>
          </article>

          <div class="split-actions">
            <button class="btn full" onclick="openChat('${person.id}')">发消息</button>
            <button class="btn full secondary" onclick="showToast('已跳过该用户')">跳过</button>
          </div>`;
      },

      chat() {
        const person = state.person;
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('messages')")}
            <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1">
              ${avatar(person, "sm")}
              <div class="list-copy">
                <h3>${person.name}</h3>
                <p>${person.status} · 阅后 24h 自动清理</p>
              </div>
            </div>
            ${iconButton("更多", "⋯", "openSheet('chatMore')")}
          </header>

          <div class="chat-log">
            <div class="bubble left">你也喜欢徒步吗？我看你常走北线。</div>
            <div class="bubble right">是的，每周都会走一段，离线路线也有记录。</div>
            <div class="bubble left">明天一起吗？我这边 2 个人。</div>
            <div class="bubble right">可以，8 点山口见。我把补给点发到群里。</div>
          </div>

          <div class="composer">
            <button class="icon-btn" aria-label="语音" onclick="showToast('按住后开始录音')"><span class="icon">◉</span></button>
            <input placeholder="输入消息" />
            <button class="btn small" onclick="showToast('消息已发送')">发送</button>
          </div>`;
      },

      groupDetail() {
        const group = state.group;
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('groups')")}
            <div class="title-block" style="flex:1">
              <p class="eyebrow">群组详情</p>
              <h2>${group.name}</h2>
            </div>
            ${iconButton("设置", "⚙", "openSheet('groupSettings')")}
          </header>

          <section class="hero-panel" style="min-height:134px;--hero-image:url('https://picsum.photos/seed/${group.id}-group-cover/720/300')">
            <span class="signal-pill">◎ ${group.members}</span>
            <div>
              <h2>${group.name}</h2>
              <p>${group.desc}</p>
            </div>
          </section>

          <div class="section-title">
            <h3>快速入口</h3>
          </div>
          <section class="list">
            <article class="card list-card" onclick="setTab('outdoor')">
              <div class="list-copy"><h3>开启实时对讲</h3><p>成员可在弱网环境下语音中继。</p></div>
              <span class="badge">在线</span>
            </article>
            <article class="card list-card" onclick="setView('location')">
              <div class="list-copy"><h3>查看成员位置</h3><p>只显示已授权共享的队友位置。</p></div>
              <span class="badge amber">5 人</span>
            </article>
            <article class="card list-card" onclick="showToast('已退出群组')">
              <div class="list-copy"><h3 style="color:var(--red)">退出群组</h3><p>本地缓存会保留 24 小时。</p></div>
            </article>
          </section>`;
      },

      talk() {
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('outdoor')")}
            <div class="title-block" style="flex:1">
              <p class="eyebrow">实时对讲</p>
              <h2>徒步登山小队</h2>
            </div>
            ${iconButton("设置", "⚙", "openSheet('talkSettings')")}
          </header>

          <button class="talk-button" onclick="showToast('正在发送语音')">
            <span>
              <span class="icon" style="font-size:44px">◉</span>
              <strong>按住说话</strong>
            </span>
          </button>

          <section class="list">
            <article class="card list-card">
              <div class="list-main">${avatar(people[0], "sm")}<div class="list-copy"><h3>刘雨</h3><p>刚刚发送 6 秒语音</p></div></div>
              <span class="badge">已达</span>
            </article>
            <article class="card list-card">
              <div class="list-main">${avatar(people[1], "sm")}<div class="list-copy"><h3>邓丽</h3><p>等待中继确认</p></div></div>
              <span class="badge amber">中继</span>
            </article>
          </section>`;
      },

      location() {
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('outdoor')")}
            <div class="title-block" style="flex:1">
              <p class="eyebrow">位置共享</p>
              <h2>队伍地图</h2>
            </div>
            ${iconButton("刷新", "↻", "showToast('位置已刷新')")}
          </header>
          <section class="map-panel" style="min-height:340px">
            ${mapArt()}
            <div class="map-label">
              <h3>全员在安全半径内</h3>
              <p>最近成员 320m，最远成员 1.2km。</p>
            </div>
          </section>
          <div class="section-title"><h3>成员位置</h3></div>
          <section class="list">
            ${people.slice(0, 3).map(person => `
              <article class="card list-card">
                <div class="list-main">${avatar(person, "sm")}<div class="list-copy"><h3>${person.name}</h3><p>${person.distance} · ${person.status}</p></div></div>
                <span class="badge">已共享</span>
              </article>`).join("")}
          </section>`;
      },

      settings() {
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('profile')")}
            <div class="title-block" style="flex:1"><p class="eyebrow">设置</p><h1>设置</h1></div>
          </header>
          <section class="list">
            <article class="card list-card" onclick="setView('privacy')"><div class="list-copy"><h3>隐私设置</h3><p>距离可见、位置共享、黑名单</p></div><span class="icon">›</span></article>
            <article class="card list-card" onclick="showToast('账号安全已打开')"><div class="list-copy"><h3>账号安全</h3><p>本机密钥、恢复码、设备管理</p></div><span class="icon">›</span></article>
            <article class="card list-card" onclick="showToast('通用设置已打开')"><div class="list-copy"><h3>通用设置</h3><p>通知、声音、低电量模式</p></div><span class="icon">›</span></article>
          </section>`;
      },

      privacy() {
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('profile')")}
            <div class="title-block" style="flex:1"><p class="eyebrow">隐私</p><h1>隐私设置</h1></div>
          </header>
          <section class="list">
            <article class="card list-card" onclick="showToast('实时位置已隐藏')"><div class="list-copy"><h3>隐藏实时位置</h3><p>仅显示大致距离，不显示精确坐标。</p></div><span class="badge">开启</span></article>
            <article class="card list-card" onclick="showToast('隐身模式已开启')"><div class="list-copy"><h3>隐身模式</h3><p>暂停出现在附近推荐中。</p></div><span class="badge amber">手动</span></article>
            <article class="card list-card" onclick="showToast('消息清理规则已更新')"><div class="list-copy"><h3>阅后即焚</h3><p>私聊默认 24 小时后清理。</p></div><span class="badge">24h</span></article>
          </section>`;
      },

      member() {
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('profile')")}
            <div class="title-block" style="flex:1"><p class="eyebrow">会员中心</p><h1>Pro 权益</h1></div>
          </header>
          <section class="hero-panel" style="--hero-image:url('https://picsum.photos/seed/offline-pro-membership/720/340')">
            <span class="signal-pill">◇ 当前为 Pro</span>
            <div><h2>高级中继与路线备份</h2><p>适合高频户外、群组组织者和应急通信场景。</p></div>
          </section>
          <div class="split-actions">
            <button class="btn full warning" onclick="showToast('年度套餐已选择')">¥79 / 年</button>
            <button class="btn full secondary" onclick="showToast('月度套餐已选择')">¥9.9 / 月</button>
          </div>`;
      },

      device() {
        return `
          <header class="page-head">
            ${iconButton("返回", "←", "setTab('profile')")}
            <div class="title-block" style="flex:1"><p class="eyebrow">设备绑定</p><h1>绑定设备</h1></div>
          </header>
          <section class="map-panel" style="min-height:240px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(25,195,125,.16),rgba(85,194,255,.08)),var(--panel)">
            <div style="width:138px;height:138px;border-radius:12px;background:
              linear-gradient(90deg, var(--text) 10px, transparent 10px) 0 0/28px 28px,
              linear-gradient(var(--text) 10px, transparent 10px) 0 0/28px 28px,
              #0b1112;border:10px solid #f7fbfb"></div>
          </section>
          <section class="list" style="margin-top:14px">
            <article class="card list-card" onclick="showToast('已打开扫码绑定')"><div class="list-copy"><h3>扫码绑定</h3><p>扫描设备二维码完成本机密钥配对。</p></div><span class="badge">推荐</span></article>
            <article class="card list-card" onclick="showToast('附近设备搜索中')"><div class="list-copy"><h3>搜索附近设备</h3><p>通过短距广播发现可绑定设备。</p></div><span class="icon">›</span></article>
          </section>`;
      }
    };

    function renderSheet(type) {
      const close = `<button class="icon-btn" aria-label="关闭" onclick="closeSheet()"><span class="icon">×</span></button>`;
      const heads = {
        filter: ["筛选附近的人", "调整距离、兴趣和在线状态。"],
        search: ["搜索", "输入昵称、兴趣或群组名称。"],
        createGroup: ["创建群组", "为附近活动建立一个本地频道。"],
        sos: ["SOS 紧急求救", "向 5 公里内用户和已加入群组发送求救信号。"],
        newMessage: ["新消息", "选择附近用户发起短距聊天。"],
        personMore: ["更多操作", "管理这个用户的可见性和信任状态。"],
        chatMore: ["聊天设置", "管理消息生命周期和提醒。"],
        groupSettings: ["群组设置", "调整群组通知、置顶和成员可见性。"],
        talkSettings: ["对讲设置", "调整音量、降噪和中继优先级。"]
      };
      const [title, desc] = heads[type] || ["操作", ""];
      const head = `<div class="sheet-head"><div><h2>${title}</h2><p>${desc}</p></div>${close}</div>`;

      if (type === "filter") {
        return `${head}
          <div class="chip-row" style="margin:12px 0 16px">
            <button class="chip active">2km 内</button><button class="chip">5km 内</button><button class="chip">仅在线</button><button class="chip active">共同兴趣</button>
          </div>
          <button class="btn full" onclick="closeSheet();showToast('筛选已应用')">应用筛选</button>`;
      }

      if (type === "search") {
        return `${head}
          <input class="field" placeholder="搜索昵称 / 兴趣 / 群组" autofocus />
          <button class="btn full" onclick="closeSheet();showToast('已开始搜索')">搜索</button>`;
      }

      if (type === "createGroup") {
        return `${head}
          <input class="field" placeholder="群组名称" />
          <input class="field" placeholder="活动类型，例如徒步 / 露营" />
          <button class="btn full warning" onclick="closeSheet();showToast('群组已创建')">创建群组</button>`;
      }

      if (type === "sos") {
        return `${head}
          <article class="card list-card sos-panel" style="margin-bottom:12px">
            <div class="list-copy"><h3>将发送：当前位置、身份、应急备注</h3><p>信号会通过附近节点重复中继 15 分钟。</p></div>
          </article>
          <button class="btn full danger" onclick="closeSheet();showToast('SOS 求救信号已发送')">发送 SOS</button>`;
      }

      if (type === "newMessage") {
        return `${head}<section class="list">
          ${people.slice(0, 3).map(person => `
            <article class="card list-card" onclick="closeSheet();openChat('${person.id}')">
              <div class="list-main">${avatar(person, "sm")}<div class="list-copy"><h3>${person.name}</h3><p>${person.distance} · ${person.status}</p></div></div>
              <span class="icon">›</span>
            </article>`).join("")}
        </section>`;
      }

      return `${head}
        <section class="list">
          <article class="card list-card" onclick="closeSheet();showToast('设置已更新')"><div class="list-copy"><h3>置顶 / 收藏</h3><p>把入口固定在常用列表。</p></div><span class="icon">›</span></article>
          <article class="card list-card" onclick="closeSheet();showToast('已开启免打扰')"><div class="list-copy"><h3>免打扰</h3><p>保留 SOS 与紧急提醒。</p></div><span class="icon">›</span></article>
        </section>`;
    }

    render();
  </script>
</body>
</html>
