<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TimorPay 2.0 - Inclusive Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0057B7', // Timor Flag Blue
                        secondary: '#FFD700', // Timor Gold
                        accent: '#E41E26', // Timor Red
                        dark: '#1A1A1A',
                        surface: '#F8FAFC',
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    boxShadow: { 'soft': '0 8px 30px rgba(0, 87, 183, 0.08)' }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; background: #f1f5f9; }
        .card-gradient { background: linear-gradient(135deg, #0057B7 0%, #003D82 100%); }
        .nfc-animation { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 0.5; transform: scale(1); } }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-50 flex justify-center min-h-screen">
    <div id="root" class="w-full max-w-[430px] bg-surface h-screen shadow-2xl relative overflow-hidden flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Shared Components ---
        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            useEffect(() => { 
                if (window.lucide) {
                    window.lucide.createIcons(); 
                }
            }, [name, size, strokeWidth]);
            return <i data-lucide={name} style={{ width: size, height: size, strokeWidth: strokeWidth }} className={className}></i>;
        };

        const BottomNav = ({ active, onNavigate }) => {
            const activeTab = useMemo(() => {
                if (['agents', 'agent-detail', 'withdrawal-qr'].includes(active)) return 'agents';
                if (['remit', 'remit-claim'].includes(active)) return 'remit';
                if (['scan', 'pay-input'].includes(active)) return 'scan';
                if (['profile'].includes(active)) return 'profile';
                if (['services', 'service-detail'].includes(active)) return 'home'; // Keep home active for services for now or add its own
                if (['tcard', 'tcard-detail', 'tcard-topup', 'tcard-withdraw', 'tcard-nfc-receive', 'tcard-nfc-pay'].includes(active)) return 'home'; // Same for tcard
                return 'home';
            }, [active]);

            return (
                <div className="absolute bottom-0 left-0 right-0 bg-white/95 backdrop-blur-2xl border-t border-slate-100 px-6 pt-3 pb-8 flex justify-between items-center z-[100] shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
                    {[
                        { id: 'home', icon: 'home', label: 'Home' },
                        { id: 'agents', icon: 'map-pin', label: 'Agents' },
                        { id: 'scan', icon: 'qr-code', label: 'Pay', center: true },
                        { id: 'remit', icon: 'arrow-left-right', label: 'Remit' },
                        { id: 'profile', icon: 'user', label: 'Profile' }
                    ].map(item => (
                        <button 
                            key={item.id}
                            onClick={() => {
                                if (item.id === 'home') onNavigate('reset');
                                else onNavigate(item.id);
                            }}
                            className={`flex flex-col items-center gap-1 transition-all ${item.center ? '-mt-12' : 'active:scale-90'}`}
                        >
                            {item.center ? (
                                <div className="w-16 h-16 bg-primary rounded-full flex items-center justify-center text-white shadow-xl shadow-primary/40 border-4 border-white active:scale-95 transition-transform">
                                    <Icon name={item.icon} size={32} strokeWidth={2.5} />
                                </div>
                            ) : (
                                <div className={`${activeTab === item.id ? 'text-primary' : 'text-slate-400'} flex flex-col items-center`}>
                                    <Icon name={item.icon} size={24} strokeWidth={activeTab === item.id ? 3 : 2} />
                                    <span className={`text-[10px] mt-1 uppercase tracking-tighter ${activeTab === item.id ? 'font-black' : 'font-bold'}`}>{item.label}</span>
                                </div>
                            )}
                        </button>
                    ))}
                </div>
            );
        };

        // --- Pages ---

        const HomePage = ({ onNavigate }) => {
            return (
                <div className="flex-1 pb-32 overflow-y-auto hide-scrollbar animate-in fade-in duration-300">
                    {/* Top Bar */}
                    <div className="px-6 py-6 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white font-black italic">TP</div>
                            <div>
                                <h1 className="text-lg font-extrabold text-slate-900 leading-none">TimorPay</h1>
                                <p className="text-[10px] font-bold text-primary tracking-widest uppercase mt-1">Inclusive Finance</p>
                            </div>
                        </div>
                        <button className="w-10 h-10 bg-white rounded-full shadow-soft flex items-center justify-center relative">
                            <Icon name="bell" size={20} className="text-slate-600" />
                            <span className="absolute top-2.5 right-2.5 w-2 h-2 bg-accent rounded-full border-2 border-white"></span>
                        </button>
                    </div>

                    {/* octopus Card UI */}
                    <div className="px-6">
                        <div className="card-gradient rounded-[32px] p-6 text-white shadow-2xl shadow-primary/20 relative overflow-hidden">
                            <div className="absolute top-0 right-0 p-4 opacity-20"><Icon name="cpu" size={100} /></div>
                            <div className="flex justify-between items-start mb-8">
                                <div>
                                    <p className="text-white/60 text-xs font-bold uppercase tracking-wider mb-1">Total Balance</p>
                                    <h2 className="text-4xl font-black">USD 124.50</h2>
                                </div>
                                <div className="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-tighter border border-white/20">
                                    NFC Active
                                </div>
                            </div>
                            <div className="flex justify-between items-end">
                                <div>
                                    <p className="text-[10px] text-white/50 font-bold uppercase tracking-widest">Linked Card</p>
                                    <p className="font-mono text-sm tracking-[4px]">**** **** 8820</p>
                                </div>
                                <button onClick={() => onNavigate('tcard')} className="bg-secondary text-primary px-4 py-2 rounded-xl text-xs font-black shadow-lg active:scale-95 transition-transform uppercase">
                                    Manage Card
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Main Actions (2.0 Strategy) */}
                    <div className="px-6 mt-8 grid grid-cols-4 gap-4">
                        {[
                            { id: 'agents', icon: 'banknote', label: 'Cash In/Out', color: 'bg-blue-50 text-blue-600' },
                            { id: 'remit', icon: 'globe', label: 'Remittance', color: 'bg-emerald-50 text-emerald-600' },
                            { id: 'tcard', icon: 'credit-card', label: 'T-Card', color: 'bg-orange-100 text-orange-700 font-bold' },
                            { id: 'services', icon: 'layout-grid', label: 'Services', color: 'bg-slate-50 text-slate-600' }
                        ].map(item => (
                            <button key={item.id} onClick={() => onNavigate(item.id)} className="flex flex-col items-center gap-2 active:scale-90 transition-transform">
                                <div className={`w-14 h-14 ${item.color} rounded-2xl flex items-center justify-center shadow-sm`}>
                                    <Icon name={item.icon} size={24} />
                                </div>
                                <span className="text-[10px] font-extrabold text-slate-500 text-center leading-tight uppercase tracking-tighter">{item.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* Agent Map Preview */}
                    <div className="px-6 mt-10">
                        <div className="flex justify-between items-center mb-4">
                            <h3 className="font-extrabold text-slate-900">Nearby Agents</h3>
                            <button onClick={() => onNavigate('agents')} className="text-primary text-[10px] font-bold uppercase tracking-widest">Open Map</button>
                        </div>
                        <div className="bg-white rounded-[24px] p-4 border border-slate-100 shadow-soft">
                            <div className="flex items-center gap-4">
                                <div className="w-12 h-12 bg-primary/10 rounded-xl flex items-center justify-center text-primary">
                                    <Icon name="coffee" size={24} />
                                </div>
                                <div className="flex-1">
                                    <h4 className="text-sm font-bold text-slate-800 leading-none">Letefoho Coffee - Timor Plaza</h4>
                                    <p className="text-[10px] text-slate-400 mt-1 font-bold"><Icon name="navigation" size={8} className="inline mr-1" /> 120m away • Open until 21:00</p>
                                </div>
                                <div className="text-right">
                                    <span className="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold uppercase">Cash Ready</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Recent History (MoneyGram focused) */}
                    <div className="px-6 mt-10">
                        <h3 className="font-extrabold text-slate-900 mb-4">Recent Activity</h3>
                        <div className="space-y-3">
                            {[
                                { title: 'Intl Remittance (Wise)', subtitle: 'From: Jose Ramos (AU)', amount: '+$240.00', time: 'Today, 10:20', type: 'in' },
                                { title: 'Cash Out at Agent', subtitle: 'Timor Plaza Shop 12', amount: '-$50.00', time: 'Yesterday, 14:15', type: 'out' },
                                { title: 'T-Card Subsidy', subtitle: 'Retirement Benefit Gadu', amount: '+$120.00', time: 'May 15, 2026', type: 'in' }
                            ].map((tx, i) => (
                                <div key={i} className="flex items-center justify-between p-4 bg-white rounded-2xl border border-slate-50 shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <div className={`w-10 h-10 rounded-full flex items-center justify-center ${tx.type === 'in' ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-50 text-slate-600'}`}>
                                            <Icon name={tx.type === 'in' ? 'arrow-down-left' : 'arrow-up-right'} size={18} />
                                        </div>
                                        <div>
                                            <p className="text-xs font-black text-slate-800">{tx.title}</p>
                                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-tighter">{tx.subtitle}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <p className={`text-sm font-black ${tx.type === 'in' ? 'text-emerald-600' : 'text-slate-800'}`}>{tx.amount}</p>
                                        <p className="text-[9px] text-slate-400 font-bold">{tx.time}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const AgentFinder = ({ onBack, onNavigate }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-right duration-300 pb-32 overflow-y-auto">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full shadow-soft flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">Cash-Out Points</h2>
                </div>
                <div className="flex-1 bg-slate-200 m-4 rounded-[32px] min-h-[300px] relative overflow-hidden">
                    <div className="absolute inset-0 bg-[url('https://api.mapbox.com/styles/v1/mapbox/streets-v11/static/125.57, -8.55,14,0/400x400?access_token=pk.mock')] bg-cover bg-center"></div>
                    {/* Mock Map Markers */}
                    <button className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 bg-primary rounded-full border-4 border-white shadow-xl flex items-center justify-center text-white active:scale-90 transition-transform" onClick={() => onNavigate('agent-detail')}><Icon name="coffee" size={14} /></button>
                    <button className="absolute bottom-1/4 right-1/4 w-8 h-8 bg-accent rounded-full border-4 border-white shadow-xl flex items-center justify-center text-white active:scale-90 transition-transform" onClick={() => onNavigate('agent-detail')}><Icon name="shopping-cart" size={14} /></button>
                </div>
                <div className="px-6">
                    <h3 className="font-bold text-slate-500 text-xs uppercase tracking-widest mb-4">Closest to you</h3>
                    <button onClick={() => onNavigate('agent-detail')} className="w-full text-left active:scale-95 transition-transform">
                        <div className="bg-white rounded-3xl p-5 shadow-soft border-l-4 border-primary">
                            <div className="flex justify-between items-start mb-2">
                                <h4 className="font-black text-slate-800">Dili Mart Central</h4>
                                <span className="text-[10px] text-primary font-bold">400m</span>
                            </div>
                            <p className="text-xs text-slate-400 mb-4 font-bold uppercase tracking-tighter">Availability: High (USD 2,000+)</p>
                            <div className="w-full bg-primary text-white py-3 rounded-xl text-sm font-bold shadow-lg shadow-primary/20 text-center">Open Agent Profile</div>
                        </div>
                    </button>
                </div>
            </div>
        );

        const RemitClaimPage = ({ onBack, onNavigate }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-right duration-300 pb-32 overflow-y-auto">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">Remit Verification</h2>
                </div>
                <div className="p-8">
                    <div className="bg-white p-8 rounded-[32px] shadow-soft mb-8">
                        <div className="flex items-center gap-4 mb-8">
                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><Icon name="user-check" /></div>
                            <div>
                                <h3 className="font-black">Identity Check</h3>
                                <p className="text-[10px] text-slate-400 font-bold uppercase">Required by AML Policy</p>
                            </div>
                        </div>
                        <p className="text-sm text-slate-600 mb-6 leading-relaxed">Please confirm your <strong>Timor-Leste National ID</strong> matches the recipient name on the Wise/Remitly transfer.</p>
                        <div className="space-y-4">
                            <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between">
                                <span className="text-xs font-bold">Recipient</span>
                                <span className="text-xs font-black">Alexandre Gusmao</span>
                            </div>
                            <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between">
                                <span className="text-xs font-bold">ID Number</span>
                                <span className="text-xs font-black">TL-2024-XXXX</span>
                            </div>
                        </div>
                    </div>
                    <button onClick={() => onNavigate('success', { title: 'Funds Claimed!', msg: 'USD 240.00 has been added to your card balance.', level: 4 })} className="w-full bg-primary text-white py-5 rounded-[24px] font-black shadow-xl shadow-primary/20 active:scale-95 transition-transform">Confirm & Deposit</button>
                    <p className="mt-8 text-[11px] text-slate-400 font-bold text-center">Level 3: KYC/AML Compliance Verification</p>
                </div>
            </div>
        );

        const RemittancePage = ({ onBack, onNavigate }) => {
            const [amount, setAmount] = useState('100');
            const [phone, setPhone] = useState('+670 7720 1192');

            return (
                <div className="flex-1 bg-slate-900 flex flex-col text-white animate-in slide-in-from-bottom duration-300">
                    <div className="px-6 py-6 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                            <div>
                                <h2 className="text-xl font-extrabold">Stable-Remit</h2>
                                <p className="text-[8px] text-emerald-400 font-black uppercase tracking-widest">T-Chain / USDT Settlement</p>
                            </div>
                        </div>
                        <div className="bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-full flex items-center gap-2">
                            <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                            <span className="text-[9px] font-black uppercase tracking-tighter text-emerald-500">Node Online</span>
                        </div>
                    </div>

                    <div className="flex-1 bg-surface rounded-t-[48px] p-8 text-slate-800">
                        <div className="bg-blue-50 border border-blue-100 rounded-3xl p-5 mb-8 flex items-start gap-4">
                            <Icon name="message-square" className="text-blue-600 mt-1" size={24} />
                            <div>
                                <h3 className="font-black text-xs text-blue-900">SMS/USSD Bridge Enabled</h3>
                                <p className="text-[10px] text-blue-700/60 leading-tight font-bold">You can also use <span className="text-blue-800 font-black">*122#</span> for offline transfers.</p>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="bg-white p-6 rounded-[32px] border border-slate-100 shadow-soft">
                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-4">Transfer Mode</label>
                                <div className="grid grid-cols-2 gap-3">
                                    <button className="bg-primary text-white py-4 rounded-2xl flex flex-col items-center gap-2">
                                        <Icon name="phone" size={20} />
                                        <span className="text-[10px] font-black uppercase">To Phone (Hot)</span>
                                    </button>
                                    <button className="bg-slate-50 text-slate-400 py-4 rounded-2xl flex flex-col items-center gap-2 border border-slate-100">
                                        <Icon name="wallet" size={20} />
                                        <span className="text-[10px] font-black uppercase">To Cold Wallet</span>
                                    </button>
                                </div>
                            </div>

                            <div>
                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-2">Recipient Phone / Wallet</label>
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        value={phone}
                                        onChange={(e) => setPhone(e.target.value)}
                                        placeholder="+670 7xxx xxxx" 
                                        className="w-full bg-white border border-slate-100 rounded-2xl py-5 px-6 text-xl font-mono shadow-sm focus:ring-2 focus:ring-primary outline-none" 
                                    />
                                    <div className="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2 text-[8px] font-black text-emerald-600 bg-emerald-50 px-2 py-1 rounded-lg">
                                        <Icon name="link" size={10} />
                                        <span>LINKED</span>
                                    </div>
                                </div>
                            </div>

                            <div>
                                <label className="text-[10px] font-black uppercase tracking-widest text-slate-400 block mb-2">Amount (USD/USDT)</label>
                                <input 
                                    type="number" 
                                    value={amount}
                                    onChange={(e) => setAmount(e.target.value)}
                                    placeholder="0.00" 
                                    className="w-full bg-white border border-slate-100 rounded-2xl py-5 px-6 text-3xl font-black shadow-sm outline-none" 
                                />
                            </div>

                            <button onClick={() => onNavigate('remit-confirm', { phone, amount })} className="w-full bg-primary text-white py-6 rounded-[24px] text-xl font-black shadow-2xl shadow-primary/30 active:scale-95 transition-transform flex items-center justify-center gap-3">
                                Next Step
                                <Icon name="arrow-right" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const RemitConfirmPage = ({ onBack, onNavigate, data }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-right duration-300 pb-32 overflow-y-auto">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full shadow-soft flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">Confirm Remit</h2>
                </div>
                
                <div className="px-8 flex-1 flex flex-col">
                    <div className="bg-white rounded-[40px] p-8 shadow-soft border border-slate-50 mb-10">
                        <div className="flex flex-col items-center text-center py-6 border-b border-slate-50 mb-8">
                            <p className="text-[10px] font-black text-slate-300 uppercase tracking-[4px] mb-4">You are sending</p>
                            <h3 className="text-5xl font-black text-slate-900">${data?.amount || '100'}</h3>
                            <div className="mt-4 bg-emerald-50 text-emerald-600 px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest border border-emerald-100 flex items-center gap-2">
                                <Icon name="shield-check" size={12} />
                                <span>Stable USDT Settlement</span>
                            </div>
                        </div>

                        <div className="space-y-6">
                            <div className="flex justify-between items-center">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Recipient</span>
                                <span className="text-xs font-black text-slate-800">{data?.phone || '+670 7720 1192'}</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Exchange Rate</span>
                                <span className="text-xs font-black text-slate-800">1 USD = 1.00 USDT</span>
                            </div>
                            <div className="flex justify-between items-center">
                                <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Network Fee</span>
                                <span className="text-xs font-black text-emerald-600">FREE</span>
                            </div>
                        </div>
                    </div>

                    <div className="mt-auto space-y-4">
                        <button onClick={() => onNavigate('remit-auth', data)} className="w-full bg-primary text-white py-6 rounded-[24px] text-xl font-black shadow-2xl shadow-primary/30 active:scale-95 transition-transform uppercase tracking-widest">
                            Confirm & Sign
                        </button>
                        <p className="text-[9px] font-bold text-slate-400 text-center uppercase tracking-widest">Funds will be locked in escrow until bio-verified.</p>
                    </div>
                </div>
            </div>
        );

        const RemitAuthPage = ({ onBack, onNavigate }) => {
            const [mode, setMode] = useState('face'); // 'face' or 'voice'

            return (
                <div className="flex-1 bg-slate-900 flex flex-col text-white animate-in zoom-in duration-300">
                    <div className="px-6 py-6">
                        <button onClick={onBack} className="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center"><Icon name="x" /></button>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center p-8">
                        <div className="mb-12 text-center">
                            <h2 className="text-2xl font-black mb-2">Bio-Signature</h2>
                            <p className="text-xs font-bold text-white/40 uppercase tracking-widest">Verification Required for Chain Settlement</p>
                        </div>

                        <div className="w-64 h-64 border-2 border-white/20 rounded-full flex items-center justify-center relative mb-12">
                            {mode === 'face' ? (
                                <div className="w-56 h-56 bg-primary/20 rounded-full overflow-hidden flex items-center justify-center relative">
                                    <Icon name="user" size={120} className="text-white/20" />
                                    <div className="absolute inset-0 bg-gradient-to-t from-primary/40 to-transparent"></div>
                                    {/* Scanning Line */}
                                    <div className="absolute left-0 right-0 h-1 bg-primary shadow-[0_0_15px_#0057B7] animate-[scan_3s_infinite]"></div>
                                </div>

                    <div className="flex justify-between"><span className="text-[10px] font-bold text-slate-400 uppercase">Timestamp</span><span className="text-xs font-bold">May 19, 14:30</span></div>

                <div className="px-6 grid grid-cols-2 gap-4">

                </div>
                <p className="mt-auto p-8 text-[11px] text-slate-400 font-bold text-center">Level 2: Ecosystem Service Discovery</p>
            </div>
        );

        const ServiceDetail = ({ onBack, onNavigate, data }) => (
            <div className="flex-1 bg-white flex flex-col animate-in slide-in-from-bottom duration-300">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">{data?.name || 'Service'}</h2>
                </div>
                <div className="p-8">
                    <div className="bg-slate-50 rounded-[32px] p-8 mb-8 flex flex-col items-center">
                        <div className="w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center mb-6 text-primary"><Icon name={data?.icon || 'zap'} size={32} /></div>
                        <label className="text-[10px] font-black uppercase text-slate-400 mb-2">Customer Number / Meter ID</label>
                        <input type="text" placeholder="1022-883-990" className="w-full bg-white rounded-2xl py-4 px-6 text-xl font-mono text-center outline-none focus:ring-2 focus:ring-primary" />
                        <div className="grid grid-cols-3 gap-3 w-full mt-8">
                            {['$5', '$10', '$20'].map(v => <button key={v} className="bg-white border border-slate-200 py-3 rounded-xl font-black text-xs hover:border-primary">{v}</button>)}
                        </div>
                    </div>
                    <button onClick={() => onNavigate('success', { title: 'Payment Sent', msg: `Your payment for ${data?.name} is being processed.`, level: 4 })} className="w-full bg-primary text-white py-5 rounded-[24px] font-black">Pay Securely</button>
                    <p className="mt-8 text-[11px] text-slate-400 font-bold text-center">Level 3: Micro-Payment Logic & External API Bridge</p>
                </div>
            </div>
        );

        const ScanPay = ({ onBack, onNavigate }) => {
            const [mode, setMode] = useState('pay'); // 'pay' or 'receive'

            return (
                <div className="flex-1 bg-[#0a0a0a] flex flex-col text-white animate-in zoom-in duration-500 relative">
                    {/* Header */}
                    <div className="px-6 py-8 flex justify-between items-center z-10">
                        <button onClick={onBack} className="w-10 h-10 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center border border-white/5 active:scale-90 transition-transform"><Icon name="x" /></button>
                        <div className="bg-white/5 backdrop-blur-md p-1 rounded-2xl flex items-center border border-white/5">
                            <button 
                                onClick={() => setMode('pay')}
                                className={`px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${mode === 'pay' ? 'bg-primary text-white shadow-lg' : 'text-slate-400'}`}
                            >
                                Scan to Pay
                            </button>
                            <button 
                                onClick={() => setMode('receive')}
                                className={`px-6 py-2 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${mode === 'receive' ? 'bg-primary text-white shadow-lg' : 'text-slate-400'}`}
                            >
                                Receive
                            </button>
                        </div>
                        <button className="w-10 h-10 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center border border-white/5"><Icon name="flashlight" size={20} /></button>
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center relative px-6">
                        {mode === 'pay' ? (
                            <div className="w-full flex flex-col items-center animate-in fade-in duration-500">
                                <div className="relative group mb-12">
                                    {/* Scanning Box */}
                                    <div className="w-72 h-72 border-2 border-white/10 rounded-[56px] relative overflow-hidden bg-slate-900/30 backdrop-blur-[2px]">
                                        {/* QR Code Background Animation */}
                                        <div className="absolute inset-0 flex items-center justify-center opacity-[0.15] scale-110">
                                            <Icon name="qr-code" size={300} className="text-white" />
                                        </div>
                                        
                                        {/* Corners (Glow) */}
                                        <div className="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary rounded-tl-[40px] shadow-[-4px_-4px_15px_rgba(0,87,183,0.4)]"></div>
                                        <div className="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary rounded-tr-[40px] shadow-[4px_-4px_15px_rgba(0,87,183,0.4)]"></div>
                                        <div className="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary rounded-bl-[40px] shadow-[-4px_4px_15px_rgba(0,87,183,0.4)]"></div>
                                        <div className="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary rounded-br-[40px] shadow-[4px_4px_15px_rgba(0,87,183,0.4)]"></div>
                                        
                                        {/* Scanning Line (High Precision) */}
                                        <div className="absolute inset-x-0 h-[2px] bg-gradient-to-r from-transparent via-primary to-transparent shadow-[0_0_25px_rgba(0,87,183,1)] animate-[scan_3s_infinite] z-20"></div>
                                        
                                        {/* Shimmer / Scan Shade */}
                                        <div className="absolute inset-x-0 h-1/2 bg-gradient-to-b from-primary/20 to-transparent animate-[shimmer_3s_infinite] pointer-events-none"></div>
                                    </div>
                                </div>

                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-[4px] animate-pulse">Scanning for Merchant...</p>

                                <button 
                                    onClick={() => onNavigate('pay-input')} 
                                    className="mt-16 bg-white/5 hover:bg-white/10 backdrop-blur-xl px-8 py-4 rounded-[28px] border border-white/10 flex items-center gap-4 transition-all active:scale-95 group"
                                >
                                    <div className="w-10 h-10 bg-primary/20 rounded-xl flex items-center justify-center text-primary group-hover:bg-primary group-hover:text-white transition-colors">
                                        <Icon name="store" size={20} />
                                    </div>
                                    <div className="text-left">
                                        <p className="text-[10px] font-black uppercase text-slate-500">Found Merchant</p>
                                        <p className="text-xs font-black text-white">Burger Dili - Timor Plaza</p>
                                    </div>
                                    <Icon name="chevron-right" size={16} className="text-slate-600 ml-2" />
                                </button>
                            </div>
                        ) : (
                            <div className="w-full flex flex-col items-center animate-in slide-in-from-bottom duration-500">
                                <div className="bg-white rounded-[48px] p-10 shadow-[0_20px_60px_rgba(0,0,0,0.4)] flex flex-col items-center relative overflow-hidden">
                                    <div className="absolute top-0 inset-x-0 h-2 bg-primary"></div>
                                    <div className="flex items-center gap-3 mb-8">
                                        <div className="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white text-[10px] font-black italic">TP</div>
                                        <span className="text-sm font-black text-slate-800 tracking-tighter uppercase">My Payment QR</span>
                                    </div>
                                    
                                    <div className="bg-slate-50 p-6 rounded-[32px] border border-slate-100 mb-8">
                                        <Icon name="qr-code" size={200} className="text-slate-900" strokeWidth={2.5} />
                                    </div>

                                    <div className="text-center">
                                        <p className="text-xs font-black text-slate-800 uppercase tracking-widest mb-1">Alexandre Gusmao</p>
                                        <p className="text-[10px] font-bold text-slate-400 tracking-tighter">TimorPay ID: 8820-9938-1120</p>
                                    </div>
                                </div>
                                <p className="mt-10 text-[10px] font-black text-primary uppercase tracking-[4px] text-center px-10 leading-relaxed">Present this code to the merchant to receive funds or pay</p>
                            </div>
                        )}
                    </div>
                    
                    <p className="p-10 text-[11px] text-white/20 font-bold text-center uppercase tracking-[6px]">Pay 1.0 High Fidelity</p>
                    
                    <style>{`
                        @keyframes scan { 
                            0% { top: 5%; opacity: 0; } 
                            10% { opacity: 1; }
                            50% { top: 90%; opacity: 1; } 
                            90% { opacity: 1; }
                            100% { top: 5%; opacity: 0; } 
                        }
                        @keyframes shimmer {
                            0% { transform: translateY(-100%); opacity: 0; }
                            10% { opacity: 1; }
                            50% { transform: translateY(0%); opacity: 1; }
                            90% { opacity: 1; }
                            100% { transform: translateY(100%); opacity: 0; }
                        }
                    `}</style>
                </div>
            );
        };

        const ProfilePage = ({ onBack, onNavigate }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-right duration-300">
                <div className="px-6 py-8 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full shadow-soft flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">My Profile</h2>
                </div>
                <div className="flex flex-col items-center px-6">
                    <div className="relative mb-6">
                        <div className="w-28 h-28 bg-primary rounded-[32px] flex items-center justify-center text-white shadow-xl shadow-primary/20">
                            <Icon name="user" size={56} />
                        </div>
                        <div className="absolute -bottom-2 -right-2 w-10 h-10 bg-secondary rounded-2xl border-4 border-surface flex items-center justify-center text-primary shadow-lg">
                            <Icon name="camera" size={16} />
                        </div>
                    </div>
                    <h3 className="text-2xl font-black text-slate-900">Alexandre Gusmao</h3>
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">TL-2024-8839-X</p>
                    
                    <div className="w-full mt-10 space-y-3">
                        {[
                            { icon: 'shield', label: 'Security Settings', val: 'Level 3 Verified' },
                            { icon: 'credit-card', label: 'Payment Methods', val: '1 Linked Card' },
                            { icon: 'languages', label: 'App Language', val: 'Tetum / English' },
                            { icon: 'help-circle', label: 'Support Center', val: '' }
                        ].map((item, i) => (
                            <div key={i} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center group active:scale-[0.98] transition-all">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 bg-slate-50 text-slate-600 rounded-xl flex items-center justify-center group-hover:bg-primary/10 group-hover:text-primary transition-colors">
                                        <Icon name={item.icon} size={20} />
                                    </div>
                                    <span className="text-sm font-bold text-slate-700">{item.label}</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-[10px] font-black text-slate-300 uppercase">{item.val}</span>
                                    <Icon name="chevron-right" size={16} className="text-slate-200" />
                                </div>
                            </div>
                        ))}
                    </div>

                    <button className="w-full mt-8 bg-accent/5 text-accent py-5 rounded-[24px] font-black text-xs uppercase tracking-widest border border-accent/10">
                        Sign Out
                    </button>
                    <p className="mt-8 text-[11px] text-slate-400 font-bold text-center tracking-[4px] uppercase">Level 2: Account Management</p>
                </div>
            </div>
        );

        const PayInput = ({ onBack, onNavigate }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-bottom duration-300">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">Payment to Burger Dili</h2>
                </div>
                <div className="p-8 flex-1 flex flex-col">
                    <div className="bg-white rounded-[48px] p-10 shadow-soft border border-slate-50 flex flex-col items-center">
                        <div className="w-20 h-20 bg-primary/5 text-primary rounded-[24px] flex items-center justify-center mb-6"><Icon name="store" size={40} /></div>
                        <p className="text-xs font-bold text-slate-400 uppercase mb-4 tracking-tighter">Enter Amount (USD)</p>
                        <div className="flex items-baseline gap-1 text-5xl font-black text-slate-900 mb-8">
                            <span className="text-2xl text-slate-300">$</span>
                            <input type="number" defaultValue="8.50" className="w-32 bg-transparent outline-none text-center" />
                        </div>
                        <div className="w-full flex justify-between p-4 bg-slate-50 rounded-2xl">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">Available</span>
                            <span className="text-[10px] font-black text-primary">$124.50</span>
                        </div>
                    </div>
                    <div className="mt-auto">
                        <button onClick={() => onNavigate('success', { title: 'Payment Successful', msg: 'You have paid $8.50 to Burger Dili.', level: 4 })} className="w-full bg-primary text-white py-6 rounded-[32px] text-xl font-black shadow-2xl shadow-primary/30 active:scale-95 transition-transform">
                            Swipe to Pay
                        </button>
                        <p className="mt-6 text-[11px] text-slate-400 font-bold text-center">Level 3: Real-time Transaction Settlement</p>
                    </div>
                </div>
            </div>
        );

        // --- Main App Controller ---
        const App = () => {
            const [navStack, setNavStack] = useState([{ id: 'home' }]);
            
            const currentScreen = navStack[navStack.length - 1];

            const navigate = (id, data = null) => {
                if (id === 'reset') {
                    setNavStack([{ id: 'home' }]);
                } else {
                    setNavStack([...navStack, { id, data }]);
                }
            };

            const goBack = () => {
                if (navStack.length > 1) {
                    setNavStack(navStack.slice(0, -1));
                }
            };

            const renderScreen = () => {
                switch(currentScreen.id) {
                    case 'agents': return <AgentFinder onBack={goBack} onNavigate={navigate} />;
                    case 'agent-detail': return <AgentDetail onBack={goBack} onNavigate={navigate} />;
                    case 'withdrawal-qr': return <WithdrawalQR onBack={goBack} onNavigate={navigate} />;
                    case 'remit': return <RemittancePage onBack={goBack} onNavigate={navigate} />;
                    case 'remit-confirm': return <RemitConfirmPage onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'remit-auth': return <RemitAuthPage onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'remit-trace': return <RemitTracePage onBack={goBack} onNavigate={navigate} />;
                    case 'remit-claim': return <RemitClaimPage onBack={goBack} onNavigate={navigate} />;
                    case 'card-mgmt': return <CardMgmt onBack={goBack} />;
                    case 'tcard': return <TCardPage onBack={goBack} onNavigate={navigate} />;
                    case 'tcard-detail': return <TCardDetail onBack={goBack} data={currentScreen.data} onNavigate={navigate} />;
                    case 'tcard-topup': return <TCardTopUp onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'tcard-withdraw': return <TCardNFCAction type="withdraw" onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'tcard-nfc-receive': return <TCardNFCAction type="receive" onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'tcard-nfc-pay': return <TCardNFCAction type="pay" onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'services': return <ServicesPage onBack={goBack} onNavigate={navigate} />;
                    case 'service-detail': return <ServiceDetail onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'scan': return <ScanPay onBack={goBack} onNavigate={navigate} />;
                    case 'pay-input': return <PayInput onBack={goBack} onNavigate={navigate} />;
                    case 'profile': return <ProfilePage onBack={goBack} />;
                    case 'success': return <SuccessPage onBack={(home) => home ? setNavStack([{id:'home'}]) : goBack()} data={currentScreen.data} />;
                    case 'home':
                    default: return <HomePage onNavigate={navigate} />;
                }
            };

            return (
                <div className="flex-1 flex flex-col h-full relative overflow-hidden">
                    {renderScreen()}
                    <BottomNav active={currentScreen.id} onNavigate={navigate} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
