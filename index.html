<!DOCTYPE html>

                extend: {

    <div id="root" class="w-full max-w-[430px] bg-surface min-h-screen shadow-2xl relative overflow-hidden flex flex-col"></div>

        // --- Shared Components ---

                        className={`flex flex-col items-center gap-1 transition-all ${item.center ? '-mt-12' : ''}`}

                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">Remit Verification</h2>
                </div>
                <div className="p-8">
                    <div className="bg-white p-8 rounded-[32px] shadow-soft mb-8">
                        <div className="flex items-center gap-4 mb-8">
                            <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><Icon name="user-check" /></div>
                            <div>
                                <h3 className="font-black">Identity Check</h3>
                                <p className="text-[10px] text-slate-400 font-bold uppercase">Required by AML Policy</p>
                            </div>
                        </div>
                        <p className="text-sm text-slate-600 mb-6 leading-relaxed">Please confirm your <strong>Timor-Leste National ID</strong> matches the recipient name on the Wise/Remitly transfer.</p>
                        <div className="space-y-4">
                            <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between">
                                <span className="text-xs font-bold">Recipient</span>
                                <span className="text-xs font-black">Alexandre Gusmao</span>
                            </div>
                            <div className="p-4 bg-slate-50 rounded-2xl border border-slate-100 flex justify-between">
                                <span className="text-xs font-bold">ID Number</span>
                                <span className="text-xs font-black">TL-2024-XXXX</span>
                            </div>
                        </div>
                    </div>
                    <button onClick={() => onNavigate('success', { title: 'Funds Claimed!', msg: 'USD 240.00 has been added to your card balance.', level: 4 })} className="w-full bg-primary text-white py-5 rounded-[24px] font-black">Confirm & Deposit</button>
                    <p className="mt-8 text-[11px] text-slate-400 font-bold text-center">Level 3: KYC/AML Compliance Verification</p>
                </div>
            </div>
        );

        const ServicesPage = ({ onBack, onNavigate }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-right duration-300">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">Local Services</h2>
                </div>
                <div className="px-6 grid grid-cols-2 gap-4">
                    {[
                        { id: 'topup', icon: 'smartphone', label: 'Mobile Topup', color: 'bg-blue-50 text-blue-600' },
                        { id: 'bills', icon: 'zap', label: 'EDTL (Power)', color: 'bg-amber-50 text-amber-600' },
                        { id: 'church', icon: 'church', label: 'Donations', color: 'bg-accent/5 text-accent' },
                        { id: 'tax', icon: 'file-text', label: 'Tax Payment', color: 'bg-slate-50 text-slate-600' }
                    ].map(item => (
                        <button key={item.id} onClick={() => onNavigate('service-detail', { name: item.label, icon: item.icon })} className="bg-white p-6 rounded-[32px] shadow-sm border border-slate-50 flex flex-col items-center gap-4 active:scale-95 transition-transform">
                            <div className={`w-14 h-14 ${item.color} rounded-2xl flex items-center justify-center`}><Icon name={item.icon} /></div>
                            <span className="text-xs font-black text-slate-800 uppercase tracking-tighter">{item.label}</span>

                <p className="mt-auto p-8 text-[11px] text-slate-400 font-bold text-center">Level 2: Ecosystem Service Discovery</p>
            </div>
        );

        const ServiceDetail = ({ onBack, onNavigate, data }) => (
            <div className="flex-1 bg-white flex flex-col animate-in slide-in-from-bottom duration-300">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">{data?.name || 'Service'}</h2>
                </div>
                <div className="p-8">
                    <div className="bg-slate-50 rounded-[32px] p-8 mb-8 flex flex-col items-center">
                        <div className="w-16 h-16 bg-white rounded-2xl shadow-sm flex items-center justify-center mb-6 text-primary"><Icon name={data?.icon || 'zap'} size={32} /></div>
                        <label className="text-[10px] font-black uppercase text-slate-400 mb-2">Customer Number / Meter ID</label>
                        <input type="text" placeholder="1022-883-990" className="w-full bg-white rounded-2xl py-4 px-6 text-xl font-mono text-center outline-none focus:ring-2 focus:ring-primary" />

                    <button onClick={() => onNavigate('success', { title: 'Payment Sent', msg: `Your payment for ${data?.name} is being processed.`, level: 4 })} className="w-full bg-primary text-white py-5 rounded-[24px] font-black">Pay Securely</button>

        const ScanPay = ({ onBack, onNavigate }) => (
            <div className="flex-1 bg-black flex flex-col text-white animate-in zoom-in duration-500 relative">
                <div className="px-6 py-8 flex justify-between items-center z-10">
                    <button onClick={onBack} className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center"><Icon name="x" /></button>
                    <span className="text-xs font-black uppercase tracking-widest">Scan Merchant QR</span>
                    <button className="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center"><Icon name="flashlight" size={20} /></button>
                </div>
                <div className="flex-1 flex flex-col items-center justify-center relative">
                    <div className="relative group">
                        {/* Scanning Box */}
                        <div className="w-72 h-72 border-2 border-white/20 rounded-[56px] relative overflow-hidden bg-slate-900/40 backdrop-blur-sm">
                            {/* QR Code Image Placeholder */}
                            <div className="absolute inset-0 flex items-center justify-center opacity-40">
                                <Icon name="qr-code" size={200} className="text-white" />
                            </div>
                            
                            {/* Corners */}
                            <div className="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary rounded-tl-[40px]"></div>
                            <div className="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary rounded-tr-[40px]"></div>
                            <div className="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary rounded-bl-[40px]"></div>
                            <div className="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary rounded-br-[40px]"></div>
                            
                            {/* Scanning Line */}
                            <div className="absolute inset-x-0 h-1 bg-primary shadow-[0_0_20px_rgba(0,87,183,0.8)] animate-[scan_2.5s_infinite] z-20"></div>
                            
                            {/* Shimmer Effect */}
                            <div className="absolute inset-0 bg-gradient-to-b from-primary/10 to-transparent h-1/2 animate-[shimmer_2.5s_infinite]"></div>
                        </div>
                    </div>

                    <div className="mt-12 flex flex-col items-center animate-bounce">
                        <p className="text-xs font-bold text-primary uppercase tracking-[4px]">Align QR Code</p>
                    </div>

                    <button 
                        onClick={() => onNavigate('pay-input')} 
                        className="mt-10 bg-white/10 hover:bg-white/20 backdrop-blur-md px-8 py-3 rounded-2xl border border-white/10 flex items-center gap-3 transition-all active:scale-95"
                    >
                        <Icon name="store" size={18} />
                        <span className="text-[10px] font-black uppercase tracking-wider">Simulate Found: Burger Dili</span>
                    </button>
                </div>
                
                <p className="p-10 text-[11px] text-white/40 font-bold text-center uppercase tracking-widest">Level 2: Computer Vision / Scan Integration</p>
                
                <style>{`
                    @keyframes scan { 
                        0% { top: 5%; } 
                        50% { top: 90%; opacity: 1; } 
                        100% { top: 5%; } 
                    }
                    @keyframes shimmer {
                        0% { transform: translateY(-100%); }
                        50% { transform: translateY(100%); }
                        100% { transform: translateY(-100%); }
                    }
                `}</style>
            </div>
        );

        const ProfilePage = ({ onBack }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-right duration-300">
                <div className="px-6 py-8 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full shadow-soft flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">My Profile</h2>
                </div>
                <div className="flex flex-col items-center px-6">
                    <div className="relative mb-6">
                        <div className="w-28 h-28 bg-primary rounded-[32px] flex items-center justify-center text-white shadow-xl shadow-primary/20">
                            <Icon name="user" size={56} />
                        </div>
                        <div className="absolute -bottom-2 -right-2 w-10 h-10 bg-secondary rounded-2xl border-4 border-surface flex items-center justify-center text-primary shadow-lg">
                            <Icon name="camera" size={16} />
                        </div>
                    </div>
                    <h3 className="text-2xl font-black text-slate-900">Alexandre Gusmao</h3>
                    <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">TL-2024-8839-X</p>
                    
                    <div className="w-full mt-10 space-y-3">
                        {[
                            { icon: 'shield', label: 'Security Settings', val: 'Level 3 Verified' },
                            { icon: 'credit-card', label: 'Payment Methods', val: '1 Linked Card' },
                            { icon: 'languages', label: 'App Language', val: 'Tetum / English' },
                            { icon: 'help-circle', label: 'Support Center', val: '' }
                        ].map((item, i) => (
                            <div key={i} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm flex justify-between items-center group active:scale-[0.98] transition-all">
                                <div className="flex items-center gap-4">
                                    <div className="w-10 h-10 bg-slate-50 text-slate-600 rounded-xl flex items-center justify-center group-hover:bg-primary/10 group-hover:text-primary transition-colors">
                                        <Icon name={item.icon} size={20} />
                                    </div>
                                    <span className="text-sm font-bold text-slate-700">{item.label}</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <span className="text-[10px] font-black text-slate-300 uppercase">{item.val}</span>
                                    <Icon name="chevron-right" size={16} className="text-slate-200" />
                                </div>
                            </div>
                        ))}
                    </div>

                    <button className="w-full mt-8 bg-accent/5 text-accent py-5 rounded-[24px] font-black text-xs uppercase tracking-widest border border-accent/10">
                        Sign Out
                    </button>
                    <p className="mt-8 text-[11px] text-slate-400 font-bold text-center tracking-[4px] uppercase">Level 2: Account Management</p>
                </div>
            </div>
        );

        const PayInput = ({ onBack, onNavigate }) => (
            <div className="flex-1 bg-surface flex flex-col animate-in slide-in-from-bottom duration-300">
                <div className="px-6 py-6 flex items-center gap-4">
                    <button onClick={onBack} className="w-10 h-10 bg-white rounded-full flex items-center justify-center"><Icon name="chevron-left" /></button>
                    <h2 className="text-xl font-extrabold">Payment to Burger Dili</h2>
                </div>
                <div className="p-8 flex-1 flex flex-col">
                    <div className="bg-white rounded-[48px] p-10 shadow-soft border border-slate-50 flex flex-col items-center">
                        <div className="w-20 h-20 bg-primary/5 text-primary rounded-[24px] flex items-center justify-center mb-6"><Icon name="store" size={40} /></div>
                        <p className="text-xs font-bold text-slate-400 uppercase mb-4 tracking-tighter">Enter Amount (USD)</p>
                        <div className="flex items-baseline gap-1 text-5xl font-black text-slate-900 mb-8">
                            <span className="text-2xl text-slate-300">$</span>
                            <input type="number" defaultValue="8.50" className="w-32 bg-transparent outline-none text-center" />
                        </div>
                        <div className="w-full flex justify-between p-4 bg-slate-50 rounded-2xl">
                            <span className="text-[10px] font-bold text-slate-400 uppercase">Available</span>
                            <span className="text-[10px] font-black text-primary">$124.50</span>
                        </div>
                    </div>
                    <div className="mt-auto">
                        <button onClick={() => onNavigate('success', { title: 'Payment Successful', msg: 'You have paid $8.50 to Burger Dili.', level: 4 })} className="w-full bg-primary text-white py-6 rounded-[32px] text-xl font-black shadow-2xl shadow-primary/30 active:scale-95 transition-transform">
                            Swipe to Pay
                        </button>
                        <p className="mt-6 text-[11px] text-slate-400 font-bold text-center">Level 3: Real-time Transaction Settlement</p>
                    </div>
                </div>
            </div>
        );

        // --- Main App Controller ---
        const App = () => {
            const [navStack, setNavStack] = useState([{ id: 'home' }]);
            
            const currentScreen = navStack[navStack.length - 1];

            const navigate = (id, data = null) => {
                setNavStack([...navStack, { id, data }]);
            };

            const goBack = () => {
                if (navStack.length > 1) {
                    setNavStack(navStack.slice(0, -1));
                }
            };

            const renderScreen = () => {
                switch(currentScreen.id) {
                    case 'agents': return <AgentFinder onBack={goBack} onNavigate={navigate} />;
                    case 'agent-detail': return <AgentDetail onBack={goBack} onNavigate={navigate} />;
                    case 'withdrawal-qr': return <WithdrawalQR onBack={goBack} onNavigate={navigate} />;
                    case 'remit': return <RemittancePage onBack={goBack} onNavigate={navigate} />;
                    case 'remit-claim': return <RemitClaimPage onBack={goBack} onNavigate={navigate} />;
                    case 'card-mgmt': return <CardMgmt onBack={goBack} />;
                    case 'tcard': return <TCardPage onBack={goBack} onNavigate={navigate} />;
                    case 'tcard-detail': return <TCardDetail onBack={goBack} data={currentScreen.data} onNavigate={navigate} />;
                    case 'services': return <ServicesPage onBack={goBack} onNavigate={navigate} />;
                    case 'service-detail': return <ServiceDetail onBack={goBack} onNavigate={navigate} data={currentScreen.data} />;
                    case 'scan': return <ScanPay onBack={goBack} onNavigate={navigate} />;
                    case 'pay-input': return <PayInput onBack={goBack} onNavigate={navigate} />;
                    case 'profile': return <ProfilePage onBack={goBack} />;
                    case 'success': return <SuccessPage onBack={(home) => home ? setNavStack([{id:'home'}]) : goBack()} data={currentScreen.data} />;
                    case 'home':
                    default: return <HomePage onNavigate={navigate} />;
                }
            };

            return (
                <div className="flex-1 flex flex-col h-screen overflow-hidden relative">
                    {renderScreen()}
                    <BottomNav active={currentScreen.id} onNavigate={navigate} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
